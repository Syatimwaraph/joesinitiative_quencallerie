<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Daily Sales Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
<!-- ================= TOP NAVBAR ================= -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand fw-bold">Quencallerie</span>

    <div>
        <a href="/logout" class="btn btn-danger btn-sm">Exit</a>
    </div>
</nav>

<!-- ================= SECOND NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-3">

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">

            <li class="nav-item">
                <a class="nav-link active" href="/dashboard">Dashboard</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/sales">
                    Sales
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/reports/daily">Reports</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/reports/inventory">Inventory</a>
            </li>

        </ul>
    </div>
</nav>
<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-dark text-white">
            Daily Sales Report
        </div>

        <div class="card-body">

            <div class="row mb-4">

                <div class="col-md-6">
                    <div class="alert alert-success">
                        <h5>Total Revenue</h5>
                        <h3 th:text="${totalRevenue}"></h3>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="alert alert-primary">
                        <h5>Total Sales</h5>
                        <h3 th:text="${totalSales}"></h3>
                    </div>
                </div>

            </div>

            <table class="table table-bordered">

                <thead class="table-dark">
                <tr>
                    <th>Receipt No</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="sale : ${sales}">

                    <td th:text="${sale.receiptNumber}"></td>

                    <td th:text="${sale.saleDate}"></td>

                    <td th:text="${sale.totalAfterDiscount}"></td>

                    <td>
                        <span class="badge bg-success"
                              th:text="${sale.status}">
                        </span>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
