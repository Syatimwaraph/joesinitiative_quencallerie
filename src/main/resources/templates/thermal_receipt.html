<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Receipt</title>

    <style>

        body{
            font-family: monospace;
            width: 280px;
            margin:auto;
            font-size:12px;
        }

        .center{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse: collapse;
        }

        th, td{
            padding:3px 0;
            font-size:12px;
        }

        .line{
            border-top:1px dashed black;
            margin:5px 0;
        }

        @media print {

            body{
                width: 58mm;
            }

            .no-print{
                display:none;
            }
        }

    </style>
</head>
<body onload="window.print()">

<div class="center">

    <h3>JOES INITIATIVE</h3>
    <p>
        <span>RCCM: BBO/RCCM/23-A-1383</span>
        <span>id.Nat: 19-G4701-N41683R</span>
        <span>MN<sup>o</sup> impot: B2293919M</span>
        <span>Tel:+243975925546 (Whatsapp) et +243998963634</span>
        <span>E-mail: joelinitiativeO@gmail.com</span>
    </p>

</div>

<div class="line"></div>

<p>
    Receipt:
    <span th:text="${sale.receiptNumber}"></span>
</p>

<p>
    Date:
    <span th:text="${#temporals.format(sale.saleDate, 'dd/MM/yyyy HH:mm')}"></span>
</p>

<div class="line"></div>

<table>

    <thead>
    <tr>
        <th>Item</th>
        <th>Qty</th>
        <th>Total</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="item : ${sale.items}">

        <td th:text="${item.product.productName}"></td>

        <td th:text="${item.quantity}"></td>

        <td th:text="${item.totalPrice}"></td>

    </tr>

    </tbody>

</table>

<div class="line"></div>

<p>
    Total Before:
    <span style="float:right"
          th:text="${sale.totalBeforeDiscount}">
    </span>
</p>

<p>
    Discount:
    <span style="float:right"
          th:text="${sale.discountAmount}">
    </span>
</p>

<h3>
    TOTAL:
    <span style="float:right"
          th:text="${sale.totalAfterDiscount}">
    </span>
</h3>

<div class="line"></div>

<div class="center">

    <p>Thank you!</p>

</div>

<br><br>

<div class="no-print center">
    <button onclick="window.print()">
        Print Again
    </button>
</div>

</body>
</html>
