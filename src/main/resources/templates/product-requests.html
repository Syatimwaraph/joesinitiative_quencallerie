<!-- templates/product-requests.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Requests - Quencallerie</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

<!-- ================= TOP NAVBAR ================= -->
<nav class="navbar navbar-dark bg-dark px-3">
    <a href="#"
       class="navbar-brand fw-bold text-white text-decoration-none">
        Quencallerie
    </a>

    <div class="d-flex gap-2">
        <a href="/pos" class="btn btn-success btn-sm">
            POS
        </a>

        <a href="/logout" class="btn btn-danger btn-sm">
            Logout
        </a>
    </div>
</nav>

<!-- ================= PAGE CONTENT ================= -->
<div class="container mt-4">

    <!-- PAGE TITLE -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0">Requested Products</h3>
    </div>

    <!-- SUCCESS MESSAGE -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"></button>
    </div>

    <!-- TABLE CARD -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white">
            Product Request List
        </div>

        <div class="card-body p-0">
            <div class="table-responsive">

                <table class="table table-bordered table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Product Name</th>
                        <th>Description</th>
                        <th>Quantity</th>
                        <th>Requested By</th>
                        <th>Status</th>
                        <th width="180">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:if="${#lists.isEmpty(requests)}">
                        <td colspan="8"
                            class="text-center text-muted py-4">
                            No product requests found.
                        </td>
                    </tr>

                    <tr th:each="request : ${requests}">
                        <!-- ID -->
                        <td th:text="${request.id}"></td>

                        <!-- DATE -->
                        <td th:text="${#temporals.format(request.requestDate, 'dd/MM/yyyy HH:mm')}"></td>

                        <!-- PRODUCT NAME -->
                        <td th:text="${request.productName}"></td>

                        <!-- DESCRIPTION -->
                        <td th:text="${request.description}"></td>

                        <!-- QUANTITY -->
                        <td th:text="${request.requestedQuantity}"></td>

                        <!-- REQUESTED BY -->
                        <td th:text="${request.requestedBy}"></td>

                        <!-- STATUS -->
                        <td>
                            <span th:if="${request.status.name() == 'PENDING'}"
                                  class="badge bg-warning text-dark"
                                  th:text="${request.status}">
                            </span>

                            <span th:if="${request.status.name() == 'APPROVED'}"
                                  class="badge bg-success"
                                  th:text="${request.status}">
                            </span>

                            <span th:if="${request.status.name() == 'REJECTED'}"
                                  class="badge bg-danger"
                                  th:text="${request.status}">
                            </span>
                        </td>

                        <!-- ACTIONS -->
                        <td>
                            <div class="d-flex gap-1">

                                <!-- Approve -->
                                <a th:if="${request.status.name() == 'PENDING'}"
                                   th:href="@{/requisitions/approve/{id}(id=${request.id})}"
                                   class="btn btn-success btn-sm">
                                    Approve
                                </a>

                                <!-- Reject -->
                                <a th:if="${request.status.name() == 'PENDING'}"
                                   th:href="@{/requisitions/reject/{id}(id=${request.id})}"
                                   class="btn btn-danger btn-sm">
                                    Reject
                                </a>

                                <!-- Completed Status -->
                                <span th:if="${request.status.name() != 'PENDING'}"
                                      class="text-muted small">
                                    Processed
                                </span>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>
</div>

<!-- ================= BOOTSTRAP JS ================= -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
