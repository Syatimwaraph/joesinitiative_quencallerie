<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>POS - Quencallerie</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-size: 0.9rem;
        }

        .card {
            border-radius: 6px;
        }

        .card-body {
            padding: 0.5rem;
        }

        .table td, .table th {
            padding: 0.35rem;
            vertical-align: middle;
        }

        .navbar {
            padding-top: 0.25rem;
            padding-bottom: 0.25rem;
        }

        .btn-sm {
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
        }

        .form-control, .form-select {
            padding: 0.3rem 0.5rem;
            font-size: 0.85rem;
        }

        .pagination {
            margin: 0;
        }
    </style>
</head>

<body class="bg-light">

<!-- TOP NAV -->
<nav class="navbar navbar-dark bg-dark px-2">
    <span class="navbar-brand fw-bold">Quencallerie</span>
    <a href="/logout" class="btn btn-danger btn-sm">Exit</a>
</nav>

<!-- MENU -->
<nav class="navbar navbar-expand-lg bg-white border-bottom px-2 py-1">
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu"></button>

    <div class="collapse navbar-collapse" id="menu">

        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link py-1" href="/sales">Sales</a></li>
            <li class="nav-item"><a class="nav-link py-1" href="/reports/daily">Reports</a></li>
            <li class="nav-item"><a class="nav-link py-1" href="/reports/inventory">Inventory</a></li>
            <li class="nav-item"><a class="nav-link py-1" href="/product-requests">New Requisition</a></li>
        </ul>

        <div class="d-flex gap-1">
                <button class="btn btn-secondary btn-sm"
                        data-bs-toggle="modal"
                        data-bs-target="#requestProductModal">
                    Demander Un Produit
                </button>
        </div>
    </div>
</nav>

<!-- MAIN -->
<div class="container-fluid px-1 py-1">
    <div class="row g-1">

        <!-- PRODUCTS -->
        <div class="col-lg-8">
            <div class="card shadow-sm">
                <div class="card-header py-1">Products</div>

                <div class="card-body">

                    <!-- SEARCH -->
                    <form th:action="@{/pos}" method="get" class="row g-1 mb-1">
                        <div class="col-10">
                            <input type="text" name="keyword" class="form-control form-control-sm"
                                   placeholder="Search..." th:value="${keyword}">
                        </div>
                        <div class="col-2 d-grid">
                            <button class="btn btn-primary btn-sm">Go</button>
                        </div>
                    </form>

                    <!-- TABLE -->
                    <div class="table-responsive">
                        <table class="table table-sm table-hover table-bordered mb-1">
                            <thead class="table-dark">
                            <tr>
                                <th>Name</th>
                                <th>Cat</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th></th>
                            </tr>
                            </thead>

                            <tbody>
<!--                            <tr th:each="product : ${products}">-->
                            <tr th:each="product : ${products.content}">
                                <td th:text="${product.productName}"></td>
                                <td th:text="${product.productCategory}"></td>
                                <td th:text="${product.sellingPrice}"></td>
                                <td th:text="${product.stock}"></td>
                                <td>
                                    <div class="d-flex gap-1 flex-wrap">
                                        <a th:href="@{/cart/add/{id}(id=${product.id})}" class="btn btn-sm btn-warning">Buy</a>
                                    </div>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- PAGINATION -->
                    <nav class="d-flex justify-content-between align-items-center flex-wrap gap-1">

                        <small>
                            Page <b th:text="${products.number + 1}"></b>
                            / <b th:text="${products.totalPages}"></b>
                        </small>

                        <ul class="pagination pagination-sm">

                            <li class="page-item" th:classappend="${products.first} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/pos(page=${products.number - 1}, size=${products.size}, keyword=${keyword})}">
                                    ‹
                                </a>
                            </li>

                            <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages - 1)}"
                                th:classappend="${i == products.number} ? 'active'">
                                <a class="page-link"
                                   th:href="@{/pos(page=${i}, size=${products.size}, keyword=${keyword})}"
                                   th:text="${i + 1}">
                                </a>
                            </li>

                            <li class="page-item" th:classappend="${products.last} ? 'disabled'">
                                <a class="page-link"
                                   th:href="@{/pos(page=${products.number + 1}, size=${products.size}, keyword=${keyword})}">
                                    ›
                                </a>
                            </li>

                        </ul>
                    </nav>

                </div>
            </div>
        </div>

        <!-- CART -->
        <div class="col-lg-4">
            <div class="card shadow-sm">

                <div class="card-header py-1">Cart</div>

                <div class="card-body">

                    <!-- CART ITEMS -->
                    <div class="table-responsive">
                        <table class="table table-sm table-bordered mb-2">
                            <thead class="table-dark">
                            <tr>
                                <th>Item</th>
                                <th>Qty</th>
                                <th>Total</th>
                                <th></th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="item : ${cart}">
                                <!-- PRODUCT NAME -->
                                <td th:text="${item.product.productName}"></td>

                                <!-- QUANTITY -->
                                <td>
                                    <div class="d-flex gap-1 align-items-center">
                                        <span th:text="${item.quantity}"></span>

                                        <a class="btn btn-sm btn-success"
                                           th:href="@{/cart/increase/{id}(id=${item.productId})}">
                                            +
                                        </a>

                                        <a class="btn btn-sm btn-danger"
                                           th:href="@{/cart/decrease/{id}(id=${item.productId})}">
                                            -
                                        </a>
                                    </div>
                                </td>

                                <!-- ITEM TOTAL -->
                                <td th:text="${#numbers.formatDecimal(item.totalPrice, 1, 2)}"></td>

                                <!-- REMOVE -->
                                <td>
                                    <a class="btn btn-sm btn-dark"
                                       th:href="@{/cart/remove/{id}(id=${item.productId})}">
                                        X
                                    </a>
                                </td>
                            </tr>

                            <!-- EMPTY CART -->
                            <tr th:if="${#lists.isEmpty(cart)}">
                                <td colspan="4" class="text-center text-muted">
                                    Cart is empty
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- TOTAL BEFORE DISCOUNT -->
                    <div class="d-flex justify-content-between mb-2">
                        <strong>Total Before Discount:</strong>
                        <span class="text-primary fw-bold"
                              th:text="${#numbers.formatDecimal(totalBeforeDiscount, 1, 2)}">
                </span>
                    </div>

                    <!-- DISCOUNT FORM -->
                    <form th:action="@{/cart/apply-discount}" method="post" class="mb-2">

                        <label for="discount" class="form-label fw-bold mb-1">
                            Discount Amount
                        </label>

                        <div class="input-group input-group-sm">
                            <input type="number"
                                   step="0.01"
                                   min="0"
                                   name="discount"
                                   id="discount"
                                   class="form-control"
                                   placeholder="0.00"
                                   th:value="${discount != null ? discount : 0}">

                            <span class="input-group-text">FC</span>

                            <button type="submit" class="btn btn-warning">
                                Apply
                            </button>
                        </div>
                    </form>

                    <!-- DISCOUNT DISPLAY -->
                    <div class="d-flex justify-content-between mb-2">
                        <strong>Discount:</strong>
                        <span class="text-danger fw-bold"
                              th:text="${#numbers.formatDecimal(discount != null ? discount : 0, 1, 2)}">
                </span>
                    </div>

                    <!-- FINAL TOTAL -->
                    <div class="d-flex justify-content-between mb-3">
                        <strong class="fs-5">Total After Discount:</strong>
                        <span class="text-success fw-bold fs-5"
                              th:text="${#numbers.formatDecimal(finalTotal != null ? finalTotal : totalAfterDiscount, 1, 2)}">
                </span>
                    </div>

                    <!-- ACTION BUTTONS -->
                    <a href="/cart/checkout"
                       class="btn btn-info btn-sm w-100 mt-1">
                        Checkout
                    </a>

<!--                    <a href="/cart/receipt"-->
<!--                       class="btn btn-dark btn-sm w-100 mt-1">-->
<!--                        Print Receipts-->
<!--                    </a>-->

                </div>
            </div>
        </div>

<!--        <div class="col-lg-4">-->
<!--            <div class="card shadow-sm">-->

<!--                <div class="card-header py-1">Cart</div>-->

<!--                <div class="card-body">-->

<!--                    <div class="table-responsive">-->
<!--                        <table class="table table-sm table-bordered mb-1">-->
<!--                            <thead class="table-dark">-->
<!--                            <tr>-->
<!--                                <th>Item</th>-->
<!--                                <th>Qty</th>-->
<!--                                <th>Total</th>-->
<!--                                <th></th>-->
<!--                            </tr>-->
<!--                            </thead>-->

<!--                            <tbody>-->
<!--                            <tr th:each="item : ${cart}">-->
<!--                                <td th:text="${item.product.productName}"></td>-->

<!--                                <td>-->
<!--                                    <div class="d-flex gap-1 align-items-center">-->

<!--                                        <span th:text="${item.quantity}"></span>-->

<!--                                        <a class="btn btn-sm btn-success"-->
<!--                                           th:href="@{/cart/increase/{id}(id=${item.productId})}">+</a>-->

<!--                                        <a class="btn btn-sm btn-danger"-->
<!--                                           th:href="@{/cart/decrease/{id}(id=${item.productId})}">-</a>-->
<!--                                    </div>-->
<!--                                </td>-->

<!--                                <td th:text="${item.totalPrice}"></td>-->

<!--                                <td>-->
<!--                                    <a class="btn btn-sm btn-dark"-->
<!--                                       th:href="@{/cart/remove/{id}(id=${item.productId})}">-->
<!--                                        X-->
<!--                                    </a>-->
<!--                                </td>-->
<!--                            </tr>-->
<!--                            </tbody>-->
<!--                        </table>-->
<!--                    </div>-->

<!--                    <div class="d-flex justify-content-between">-->
<!--                        <strong>Total:</strong>-->
<!--                        <span class="text-success" th:text="${total}"></span>-->
<!--                    </div>-->

<!--                    <a href="/cart/checkout" class="btn btn-success btn-sm w-100 mt-1">Checkout</a>-->
<!--                    <a href="/cart/receipt" class="btn btn-dark btn-sm w-100 mt-1">Print</a>-->

<!--                </div>-->
<!--            </div>-->
<!--        </div>-->
    </div>

    <!--    PRODUCT REQUEST MODAL-->
    <div class="modal fade" id="requestProductModal">
        <div class="modal-dialog">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title">Request New Product</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <form th:action="@{/product-requests/save}"
                          method="post">

                        <div class="mb-3">
                            <label>Product Name</label>
                            <input type="text"
                                   name="productName"
                                   class="form-control"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label>Description</label>
                            <textarea name="description"
                                      class="form-control"></textarea>
                        </div>

                        <div class="mb-3">
                            <label>Quantity Needed</label>
                            <input type="number"
                                   name="requestedQuantity"
                                   class="form-control"
                                   required>
                        </div>

                        <button class="btn btn-primary w-100">
                            Submit Request
                        </button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
