<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Inventory Alert</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
<!-- ================= TOP NAVBAR ================= -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand fw-bold">Quencallerie</span>

    <div>
        <a href="/logout" class="btn btn-danger btn-sm">Exit</a>
    </div>
</nav>

<!-- ================= SECOND NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-3">

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">

            <li class="nav-item">
                <a class="nav-link active" href="/dashboard">Dashboard</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/sales">
                    Sales
                </a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/reports/daily">Reports</a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="/reports/inventory">Inventory</a>
            </li>

        </ul>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">
            Low Stock Products
        </div>

        <div class="card-body">

            <div class="mb-3">

                <a href="/reports/inventory/pdf"
                   class="btn btn-dark">
                    Print PDF
                </a>

            </div>

            <table class="table table-bordered table-hover">

                <thead class="table-dark">
                <tr>
                    <th>Product</th>
                    <th>Category</th>
                    <th>Current Stock</th>
                    <th>Alert Level</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="product : ${products}">

                    <td th:text="${product.productName}"></td>

                    <td th:text="${product.productCategory}"></td>

                    <td th:text="${product.stock}"></td>

                    <td th:text="${product.alertStock}"></td>

                    <td>
                        <span class="badge bg-danger">
                            Reorder Needed
                        </span>
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
