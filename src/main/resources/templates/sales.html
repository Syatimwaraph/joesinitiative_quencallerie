<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Sales History</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">
<!-- ================= TOP NAVBAR ================= -->
<nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand fw-bold">Quencallerie</span>
    <a href="/pos"
       class="btn btn-light btn-sm">
        Back To POS
    </a>
</nav>

<!-- ================= SECOND NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom px-3">

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav me-auto">

            <li class="nav-item">
                <a class="nav-link active" href="/dashboard">Dashboard</a>
            </li>

        </ul>

        <!-- ACTION BUTTONS -->
        <div class="d-flex gap-2">
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#">
                Refresh Page
            </button>

            <a class="btn btn-success btn-sm" href="/pos">
                Back to POS
            </a>
        </div>
    </div>
</nav>

<!-- CONTENT -->
<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-header d-flex justify-content-between">

            <h5>Sales History</h5>

            <input type="text"
                   id="searchInput"
                   class="form-control w-25"
                   placeholder="Search receipt...">

        </div>

        <div class="card-body table-responsive">

            <table class="table table-bordered table-hover"
                   id="salesTable">

                <thead class="table-dark">

                <tr>
                    <th>Receipt No</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>

                </thead>

                <tbody>

                <tr th:each="sale : ${sales}">

                    <!-- RECEIPT -->
                    <td th:text="${sale.receiptNumber}"></td>

                    <!-- DATE -->
                    <td th:text="${sale.saleDate}"></td>

                    <!-- TOTAL -->
                    <td th:text="${sale.totalAfterDiscount}"></td>

                    <td>

                        <span th:if="${sale.status.name() == 'PENDING'}"
                              class="badge bg-warning text-dark">
                            PENDING
                        </span>

                            <span th:if="${sale.status.name() == 'APPROVED'}"
                                  class="badge bg-success">
                            APPROVED
                        </span>

                            <span th:if="${sale.status.name() == 'CANCELLED'}"
                                  class="badge bg-danger">
                            CANCELLED
                        </span>

                    </td>

                    <!-- ACTION -->
                    <td>

                        <div class="d-flex gap-2">

                            <!-- REPRINT -->
                            <a th:href="@{/receipt/{id}(id=${sale.id})}"
                               class="btn btn-sm btn-primary">

                                Print Receipt

                            </a>

                        </div>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- SEARCH SCRIPT -->
<script>

    const searchInput =
        document.getElementById("searchInput");

    searchInput.addEventListener("keyup", function () {

        let value =
            this.value.toLowerCase();

        let rows =
            document.querySelectorAll("#salesTable tbody tr");

        rows.forEach(row => {

            row.style.display =
                row.innerText.toLowerCase()
                    .includes(value)
                    ? ""
                    : "none";
        });

    });

</script>

</body>
</html>
