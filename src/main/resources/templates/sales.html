<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Sales</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid mt-3">

    <div class="card shadow">

        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">

            <h5 class="mb-0">Sales History</h5>

            <a href="/dashboard"
               class="btn btn-light btn-sm">
                Dashboard
            </a>

        </div>

        <div class="card-body">

            <form method="get"
                  action="/sales"
                  class="row g-2 mb-3">

                <div class="col-md-4">

                    <input class="form-control"
                           name="keyword"
                           th:value="${keyword}"
                           placeholder="Search receipt...">

                </div>

                <div class="col-auto">

                    <button class="btn btn-primary">
                        Search
                    </button>

                </div>

            </form>

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                    <tr>

                        <th>#</th>
                        <th>Receipt</th>
                        <th>Date</th>
                        <th>Before Discount</th>
                        <th>Discount</th>
                        <th>Total Paid</th>
                        <th>Status</th>
                        <th>Action</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="sale : ${sales.content}">

                        <td th:text="${sale.id}"></td>

                        <td th:text="${sale.receiptNumber}"></td>

                        <td th:text="${#temporals.format(sale.saleDate,'dd/MM/yyyy HH:mm')}"></td>

                        <td th:text="${sale.totalBeforeDiscount}"></td>

                        <td th:text="${sale.discountAmount}"></td>

                        <td class="fw-bold text-success"
                            th:text="${sale.totalAfterDiscount}"></td>

                        <td>

                            <span class="badge bg-warning"
                                  th:text="${sale.status}">
                            </span>

                        </td>

                        <td>

                            <a th:href="@{/receipt/{id}(id=${sale.id})}"
                               target="_blank"
                               class="btn btn-sm btn-primary">

                                Print

                            </a>

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

            <nav>

                <ul class="pagination justify-content-center">

                    <li class="page-item"
                        th:classappend="${sales.first} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/sales(page=${sales.number-1},keyword=${keyword})}">
                            Previous
                        </a>

                    </li>

                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0,sales.totalPages-1)}"
                        th:classappend="${i==sales.number} ? 'active'">

                        <a class="page-link"
                           th:href="@{/sales(page=${i},keyword=${keyword})}"
                           th:text="${i+1}">
                        </a>

                    </li>

                    <li class="page-item"
                        th:classappend="${sales.last} ? 'disabled'">

                        <a class="page-link"
                           th:href="@{/sales(page=${sales.number+1},keyword=${keyword})}">
                            Next
                        </a>

                    </li>

                </ul>

            </nav>

        </div>

    </div>

</div>

</body>

</html>
