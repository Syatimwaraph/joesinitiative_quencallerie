<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Receipt</title>
    <style>
        body {
            font-family: monospace;
            width: 80mm;
            margin: 0 auto;
            font-size: 12px;
        }

        .center {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 2px 0;
        }

        .right {
            text-align: right;
        }

        hr {
            border: none;
            border-top: 1px dashed #000;
        }

        @media print {
            .no-print {
                display: none;
            }

            body {
                width: 80mm;
            }
        }
    </style>
</head>
<body onload="window.print()">

<div class="center">
    <h3>QUENCALLERIE</h3>
    <p>Receipt #: <span th:text="${sale.receiptNumber}"></span></p>
    <p th:text="${#temporals.format(sale.saleDate, 'dd/MM/yyyy HH:mm')}"></p>
</div>

<hr>

<table>
    <tr th:each="item : ${sale.items}">
        <td>
            <span th:text="${item.product.productName}"></span><br>
            <small>
                <span th:text="${item.quantity}"></span> x
                <span th:text="${item.unitPrice}"></span>
            </small>
        </td>
        <td class="right"
            th:text="${#numbers.formatDecimal(item.totalPrice,1,2)}">
        </td>
    </tr>
</table>

<hr>

<table>
    <tr>
        <td>Total:</td>
        <td class="right"
            th:text="${#numbers.formatDecimal(sale.totalBeforeDiscount,1,2)}"></td>
    </tr>
    <tr>
        <td>Discount:</td>
        <td class="right"
            th:text="${#numbers.formatDecimal(sale.discountAmount,1,2)}"></td>
    </tr>
    <tr>
        <td><strong>Payable:</strong></td>
        <td class="right">
            <strong th:text="${#numbers.formatDecimal(sale.totalAfterDiscount,1,2)}"></strong>
        </td>
    </tr>
</table>

<hr>

<div class="center">
    Thank you for your purchase!
</div>

<div class="no-print center" style="margin-top:10px;">
    <button onclick="window.print()">Print Again</button>
    <a href="/pos">Back to POS</a>
</div>

</body>
</html>
